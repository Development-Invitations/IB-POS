name: Release

# Ручной пуш git-тега вида v1.2.3 запускает сборку релиза: собирает Windows-инсталлятор,
# подписывает его приватным ключом апдейтера (см. apps/client/src-tauri/tauri.conf.json —
# plugins.updater.pubkey) и публикует latest.json + инсталлятор в GitHub Release. Именно
# latest.json на releases/latest/download/... опрашивает приложение при проверке обновлений.
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Полная история + теги нужны шагу "Changelog" ниже, чтобы найти предыдущий тег и
          # перечислить коммиты между ним и текущим — стандартный checkout (глубина 1) этого
          # не позволяет.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/client/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Текст релиза формируется из коммитов с прошлого тега — именно он попадает в
      # latest.json (поле notes) и его показывает UpdateNotifier.tsx кассиру/админу перед
      # обновлением ("что сделано в приложении в текстовом виде", не из исходного ТЗ — по
      # прямому запросу клиента). Первый релиз (нет предыдущего тега) — весь лог до тега.
      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --pretty=format:"- %s" HEAD)
          else
            LOG=$(git log --pretty=format:"- %s" "$PREV_TAG"..HEAD)
          fi
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$LOG"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ключ сгенерирован без пароля (см. Roadmap_TZ.md) — TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          # намеренно не передаётся: если задать её хоть пустой строкой/пробелом, Tauri решит,
          # что пароль есть, и попытается им расшифровать беспарольный ключ ("Wrong password").
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          projectPath: apps/client
          tagName: ${{ github.ref_name }}
          releaseName: "IB-POS ${{ github.ref_name }}"
          releaseBody: ${{ steps.changelog.outputs.notes }}
          # Черновик — публикуется вручную на GitHub после проверки, чтобы не раскатывать
          # автообновление на все кассы раньше времени. GitHub "latest release" (и, значит,
          # апдейтер) игнорирует черновики и pre-release до явной публикации.
          releaseDraft: true
          prerelease: false
